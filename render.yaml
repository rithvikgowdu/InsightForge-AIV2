databases:
  - name: insightforge-db
    databaseName: insightforge
    user: insightforge_user
    plan: free

services:
  - type: web
    name: insightforge-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insightforge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: USE_LIGHTWEIGHT_EMBEDDINGS
        value: "true"
      - key: LLM_PROVIDER
        value: deterministic_fallback
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"

